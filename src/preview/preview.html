<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>导出图片 · ChatGPT 对话</title>
    <link rel="icon" href="../../icons/icon32.png">
    <link rel="stylesheet" href="../../vendor/katex/katex.min.css">
    <link rel="stylesheet" href="../../vendor/hljs/github.min.css" id="hljs-light">
    <link rel="stylesheet" href="../../vendor/hljs/github-dark.min.css" id="hljs-dark" disabled>
    <link rel="stylesheet" href="preview.css">
</head>
<body>
    <aside class="toolbar">
        <h1>导出图片</h1>

        <section>
            <h2>外观</h2>
            <label class="field">主题
                <select id="opt-theme">
                    <option value="light">浅色</option>
                    <option value="dark">深色</option>
                </select>
            </label>
            <label class="field">宽度
                <select id="opt-width">
                    <option value="480">480 px（手机）</option>
                    <option value="720" selected>720 px</option>
                    <option value="900">900 px</option>
                    <option value="1100">1100 px</option>
                </select>
            </label>
            <label class="field">清晰度
                <select id="opt-scale">
                    <option value="1">1x</option>
                    <option value="2" selected>2x</option>
                    <option value="3">3x</option>
                </select>
            </label>
            <label class="check"><input type="checkbox" id="opt-header" checked> 显示标题</label>
            <label class="check"><input type="checkbox" id="opt-footer" checked> 显示页脚</label>
        </section>

        <section>
            <h2>消息 <span id="sel-count" class="count"></span></h2>
            <div class="row">
                <button type="button" id="sel-all" class="btn small">全选</button>
                <button type="button" id="sel-none" class="btn small">全不选</button>
                <button type="button" id="sel-last" class="btn small">最后一轮</button>
            </div>
            <p class="hint">点击右侧消息左上角的勾选框，可以只导出部分消息。</p>
        </section>

        <section class="export">
            <button type="button" id="btn-download" class="btn primary">下载 PNG</button>
            <button type="button" id="btn-copy" class="btn">复制图片到剪贴板</button>
            <p id="status" class="status" role="status"></p>
        </section>
    </aside>

    <main class="stage">
        <div id="card" class="card theme-light">
            <header class="card-header" id="card-header">
                <div class="card-title"><span id="card-title"></span> <span id="card-part" class="card-part"></span></div>
                <div class="card-meta" id="card-meta"></div>
            </header>
            <div class="messages" id="messages"></div>
            <footer class="card-footer" id="card-footer">
                <span>ChatGPT</span>
                <span id="card-footer-date"></span>
            </footer>
        </div>
    </main>

    <script src="../../vendor/marked.min.js"></script>
    <script src="../../vendor/purify.min.js"></script>
    <script src="../../vendor/katex/katex.min.js"></script>
    <script src="../../vendor/hljs/highlight.min.js"></script>
    <script src="../../vendor/modern-screenshot.js"></script>
    <script src="render.js"></script>
    <script src="preview.js"></script>
</body>
</html>
