<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>ChatGPT 对话导出</title>
  </head>
  <body>
    <header>
      <img src="/icon/48.png" alt="" width="24" height="24" />
      <h1>ChatGPT 对话导出</h1>
    </header>

    <p id="target" class="target">正在检测当前页面…</p>

    <div class="actions">
      <button id="btn-md" class="btn primary" disabled>
        <span class="btn-title">导出 Markdown</span>
        <span class="btn-sub">下载 .md 文件</span>
      </button>
      <button id="btn-img" class="btn" disabled>
        <span class="btn-title">导出图片</span>
        <span class="btn-sub">滚动整段对话，按页面原样截成长图</span>
      </button>
    </div>

    <fieldset class="options">
      <legend>Markdown</legend>
      <label class="option">
        <input type="checkbox" id="opt-embed" checked />
        <span>以 base64 内嵌对话图片</span>
      </label>
    </fieldset>
    <fieldset class="options">
      <legend>图片</legend>
      <label class="option">
        <input type="checkbox" id="opt-hide-actions" checked />
        <span>隐藏复制、点赞等操作按钮</span>
      </label>
      <label class="option">
        <input type="checkbox" id="opt-crop-sides" checked />
        <span>裁剪两侧空白</span>
      </label>
    </fieldset>

    <p id="status" class="status" role="status"></p>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
